name: Build Solina Refuge APK

on:
  push:
    branches: [main, master, 'preview/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Unit tests (TOTP vectors, password generator)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # امضای انتشار: فقط وقتی Secretها هست keystore را باز می‌کند و مسیر/رمزها را
      # به‌عنوان متغیر محیطی می‌دهد. گریدل فقط وقتی هر چهار مقدار رسیده باشد امضا
      # می‌کند (app/build.gradle.kts)؛ وگرنه release بدون امضا ساخته می‌شود (مثل قبل).
      # روی PR از فورک، Secretها خالی‌اند و این مرحله رد می‌شود.
      # نکته: نمی‌شود secrets را در if گذاشت (گیت‌هاب رد می‌کند)؛ پس چک خالی‌بودن
      # داخل خود اسکریپت انجام می‌شود.
      - name: Prepare release keystore (if secrets present)
        env:
          SOLINA_RELEASE_KEYSTORE_B64: ${{ secrets.SOLINA_RELEASE_KEYSTORE_B64 }}
          SOLINA_KEYSTORE_PASSWORD: ${{ secrets.SOLINA_KEYSTORE_PASSWORD }}
          SOLINA_KEY_PASSWORD: ${{ secrets.SOLINA_KEY_PASSWORD }}
          SOLINA_KEY_ALIAS: ${{ secrets.SOLINA_KEY_ALIAS }}
        run: |
          if [ -z "$SOLINA_RELEASE_KEYSTORE_B64" ]; then echo "No release keystore secret, skipping signing setup"; exit 0; fi
          echo "$SOLINA_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/solina-release.keystore"
          echo "SOLINA_KEYSTORE_FILE=$RUNNER_TEMP/solina-release.keystore" >> "$GITHUB_ENV"
          echo "SOLINA_KEYSTORE_PASSWORD=$SOLINA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SOLINA_KEY_ALIAS=$SOLINA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SOLINA_KEY_PASSWORD=$SOLINA_KEY_PASSWORD" >> "$GITHUB_ENV"

      # مطمئن می‌شویم نسخهٔ release (با R8 و حذف منابع) هم ساخته می‌شود و قوانین shrink چیزی را نمی‌شکند.
      - name: Build release (R8 minified)
        run: gradle :app:assembleRelease --stacktrace

      # اثر انگشت گواهی APK امضاشده باید با مقدار مورد انتظار بخواند؛
      # اگر apksigner پیدا نشد یا بیلد بدون Secret بود، این مرحله رد می‌شود.
      - name: Verify release signature fingerprint
        env:
          SOLINA_RELEASE_KEYSTORE_B64: ${{ secrets.SOLINA_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$SOLINA_RELEASE_KEYSTORE_B64" ]; then echo "No release keystore secret, skipping fingerprint check"; exit 0; fi
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "${ANDROID_HOME:-$HOME}" /opt -name apksigner -type f 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ] || [ ! -f "$APK" ]; then echo "apksigner or APK not found, skipping fingerprint check"; exit 0; fi
          "$APKSIGNER" verify --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -qi "03b600658806a03d5f56b610e6c9ba51e62dd292c09b530e96c8e3aa8a139cd7" || { echo "::error::Release APK fingerprint does not match the expected release certificate."; exit 1; }

      # هر خطای lint بیلد را می‌شکند.
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Solina-Refuge-preview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Solina-Refuge-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Lint summary
        if: always()
        run: |
          f=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$f" ]; then
            echo "== lint findings =="
            grep -E "(Error|Warning): " "$f" | sed 's#.*/refuge/##' | head -80
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
