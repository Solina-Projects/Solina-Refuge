name: Build Solina Refuge APK

on:
  push:
    branches: [main, master, 'preview/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests (TOTP vectors, password generator)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release keystore (if secrets present)
        if: ${{ secrets.SOLINA_RELEASE_KEYSTORE_B64 != '' }}
        env:
          SOLINA_RELEASE_KEYSTORE_B64: ${{ secrets.SOLINA_RELEASE_KEYSTORE_B64 }}
          SOLINA_KEYSTORE_PASSWORD: ${{ secrets.SOLINA_KEYSTORE_PASSWORD }}
          SOLINA_KEY_PASSWORD: ${{ secrets.SOLINA_KEY_PASSWORD }}
          SOLINA_KEY_ALIAS: ${{ secrets.SOLINA_KEY_ALIAS }}
        run: |
          echo "$SOLINA_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/solina-release.keystore"
          echo "SOLINA_KEYSTORE_FILE=$RUNNER_TEMP/solina-release.keystore" >> "$GITHUB_ENV"
          echo "SOLINA_KEYSTORE_PASSWORD=$SOLINA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SOLINA_KEY_ALIAS=$SOLINA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SOLINA_KEY_PASSWORD=$SOLINA_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release (unsigned, R8 minified)
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify release signature fingerprint
        if: ${{ secrets.SOLINA_RELEASE_KEYSTORE_B64 != '' }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "${ANDROID_HOME:-$HOME}" /opt -name apksigner -type f 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ] || [ ! -f "$APK" ]; then echo "apksigner or APK not found, skipping fingerprint check"; exit 0; fi
          "$APKSIGNER" verify --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -qi "03b600658806a03d5f56b610e6c9ba51e62dd292c09b530e96c8e3aa8a139cd7" || { echo "::error::Release APK fingerprint does not match the expected release certificate."; exit 1; }

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Solina-Refuge-preview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Lint summary
        if: always()
        run: |
          f=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$f" ]; then
            echo "== lint findings =="
            grep -E "(Error|Warning): " "$f" | sed 's#.*/refuge/##' | head -80
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
